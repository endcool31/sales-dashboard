<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026年9月 銷售分析儀表板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background: #f1f5f9; color: #1e293b; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 25px; }
        .status { font-size: 14px; color: #64748b; margin-top: 5px; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); text-align: center; }
        .card h4 { margin: 0; color: #64748b; font-size: 14px; }
        .card .val { font-size: 24px; font-weight: bold; margin-top: 8px; color: #0284c7; }
        .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(500px, 1fr)); gap: 20px; }
        .chart-box { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 2026年9月 教學銷售即時分析看板</h1>
            <div class="status">目前資料庫狀態即時同步 | 按 <b>F5</b> 立即重新抓取最新資料</div>
            <div id="updateTime" class="status"></div>
        </header>

        <div class="cards">
            <div class="card"><h4>資料筆數</h4><div class="val" id="totalRecords">-</div></div>
            <div class="card"><h4>總售出量</h4><div class="val" id="totalQty">-</div></div>
            <div class="card"><h4>總退貨量</h4><div class="val" id="totalReturns">-</div></div>
            <div class="card"><h4>淨銷售總額</h4><div class="val" id="totalRev">-</div></div>
        </div>

        <div class="charts">
            <div class="chart-box">
                <h3>每日淨銷售額折線圖</h3>
                <canvas id="dailyChart"></canvas>
            </div>
            <div class="chart-box">
                <h3>各商品淨銷售額排行</h3>
                <canvas id="prodChart"></canvas>
            </div>
            <div class="chart-box">
                <h3>各分類淨銷售額佔比</h3>
                <canvas id="catChart"></canvas>
            </div>
            <div class="chart-box">
                <h3>各通路銷售比較</h3>
                <canvas id="chanChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        async function loadData() {
            // 加入時間戳記避免快取，確保按 F5 一定抓到最新資料
            const res = await fetch('./data.json?t=' + Date.now());
            const sales = await res.json();

            document.getElementById('updateTime').innerText = "最後更新時間：" + new Date().toLocaleString();

            let q = 0, r = 0, rev = 0;
            const daily = {}, prod = {}, cat = {}, chan = {};

            sales.forEach(item => {
                q += item.quantity;
                r += item.returned_quantity;
                rev += item.net_revenue;

                daily[item.sale_date] = (daily[item.sale_date] || 0) + item.net_revenue;
                prod[item.product_name] = (prod[item.product_name] || 0) + item.net_revenue;
                cat[item.category] = (cat[item.category] || 0) + item.net_revenue;
                chan[item.channel] = (chan[item.channel] || 0) + item.net_revenue;
            });

            document.getElementById('totalRecords').innerText = sales.length;
            document.getElementById('totalQty').innerText = q.toLocaleString();
            document.getElementById('totalReturns').innerText = r.toLocaleString();
            document.getElementById('totalRev').innerText = "NT$ " + rev.toLocaleString();

            // 1. 每日趨勢
            const dates = Object.keys(daily).sort();
            new Chart(document.getElementById('dailyChart'), {
                type: 'line',
                data: {
                    labels: dates.map(d => d.slice(5)),
                    datasets: [{ label: '淨銷售額', data: dates.map(d => daily[d]), borderColor: '#0284c7', backgroundColor: 'rgba(2,132,199,0.1)', fill: true, tension: 0.2 }]
                }
            });

            // 2. 商品排行
            const sortedProd = Object.entries(prod).sort((a,b) => b[1] - a[1]);
            new Chart(document.getElementById('prodChart'), {
                type: 'bar',
                data: {
                    labels: sortedProd.map(x => x[0]),
                    datasets: [{ label: '淨營收', data: sortedProd.map(x => x[1]), backgroundColor: '#38bdf8' }]
                },
                options: { indexAxis: 'y' }
            });

            // 3. 分類佔比
            new Chart(document.getElementById('catChart'), {
                type: 'pie',
                data: {
                    labels: Object.keys(cat),
                    datasets: [{ data: Object.values(cat), backgroundColor: ['#60a5fa', '#34d399', '#fbbf24'] }]
                }
            });

            // 4. 通路比較
            new Chart(document.getElementById('chanChart'), {
                type: 'bar',
                data: {
                    labels: Object.keys(chan),
                    datasets: [{ label: '通路淨銷售額', data: Object.values(chan), backgroundColor: '#818cf8' }]
                }
            });
        }
        window.onload = loadData;
    </script>
</body>
</html>
